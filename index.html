<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mediaverse</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:#fff;color:#3d3d3d;font:15px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:10}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #5cc100;outline-offset:2px}
h2{font-size:1.1rem;margin:0 0 10px;color:#7c7c7c}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.bar{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:7px 12px}
.bar button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 10px;font-weight:700;color:#7c7c7c}
.bar button svg{width:30px;height:30px;flex:none}
.bar button:hover{color:#3d3d3d}.bar button.on{color:#5cc100}
.bar .logo{margin-right:auto;font:800 2rem/1 Nunito,Arial,sans-serif;color:#5cc100;letter-spacing:-.5px;padding-left:0;gap:6px}
.bar .logo svg{width:36px;height:36px}
.bar .pill{border:2px solid #5cc100;border-radius:999px;color:#5cc100;padding:3px 14px}
.bar .pill.fill{background:#5cc100;color:#fff}
.mw{position:relative}
.dd{position:absolute;right:0;top:100%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);border-radius:6px;min-width:170px;padding:4px;z-index:12}
.dd button{width:100%;padding:8px 10px}
@media (max-width:700px){.bar .lbl{display:none}.bar .logo{font-size:1.5rem}.bar .logo svg{width:28px;height:28px}}
.page{max-width:1000px;margin:0 auto;padding:16px 12px 30px;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:22px}
@media (max-width:800px){.page{grid-template-columns:1fr}}
.one{grid-column:1/-1;max-width:680px;width:100%;margin:0 auto}
.card,.hero,.favs,.search,.news{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);border-radius:4px}
.avbox{width:40px;height:40px;flex:none;border:1px solid #e2e2e2;border-radius:4px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12);overflow:hidden;display:block}
.avbox svg{width:100%;height:100%}.avbox.lg{width:64px;height:64px}
.btn{background:#5cc100;color:#fff;border:0;border-radius:999px;padding:8px 18px;font-weight:700}
.btn:hover{background:#4aa300}.btn[disabled]{opacity:.5}
.ghost{background:none;border:2px solid #e2e2e2;border-radius:999px;padding:6px 14px;font-weight:700;color:#7c7c7c}
.none{color:#7c7c7c;padding:14px;text-align:center}.card.none{margin-bottom:12px}
.hero{overflow:hidden;margin-bottom:28px}
.art{position:relative;aspect-ratio:16/9;min-height:190px;display:grid;place-items:center}
.big{font-size:clamp(70px,17vw,150px);filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.say{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px}
.say .avbox{width:54px;height:54px}
.bub{flex:1;background:rgba(255,255,255,.93);color:#333;border-radius:4px;padding:10px 12px;display:flex;align-items:center;overflow-wrap:anywhere}
.info{display:flex;align-items:center;gap:12px;padding:12px 14px}
.ico{width:46px;height:46px;border-radius:4px;display:grid;place-items:center;font-size:1.6rem;flex:none}
.tx{flex:1;min-width:0}.tx b{display:block;font-size:1.15rem}.sub{color:#7c7c7c;overflow-wrap:anywhere}
.chev{background:none;border:0;padding:6px;color:#7c7c7c}.chev svg{width:22px;height:22px;display:block}
.favs{padding:12px;display:flex;gap:12px;align-items:center;overflow-x:auto;margin-bottom:12px}
.tile{width:64px;height:64px;flex:none;border:3px solid #fff;outline:1px solid #e2e2e2;border-radius:4px;font-size:1.8rem;padding:0}
.search{display:flex;margin-bottom:14px}
.search input{flex:1;min-width:0;border:0;font:inherit;font-size:1.05rem;padding:11px 12px;background:none}
.news{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;padding:12px;margin-bottom:28px}
.news b{display:block;color:#6dbd1f;font-size:1.1rem}
.dw{display:flex;gap:10px;margin-bottom:14px}
.bubble{position:relative;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-5px;top:14px;width:10px;height:10px;background:#fff;transform:rotate(45deg)}
.in{position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);border-radius:4px;overflow:hidden}
.body{position:relative}
.inner p{margin:0;padding:10px 12px;overflow-wrap:anywhere;white-space:pre-wrap}
.paper{display:block;width:100%;height:auto;background:#fff}
.sp{cursor:pointer;min-height:96px}
.sp .inner{filter:blur(16px);pointer-events:none;user-select:none}
.spov{display:none}
.sp .spov{display:grid;position:absolute;inset:0;place-items:center;text-align:center;font-weight:700;padding:8px;background:rgba(255,255,255,.4)}
.foot{background:#f4f4f4;color:#7c7c7c;font-size:.8rem;padding:6px 10px}
.lk{background:none;border:0;padding:0;color:#6dbd1f;font-weight:700;font-size:inherit}
.prof{display:flex;gap:14px;align-items:center;padding:14px;margin-bottom:22px;flex-wrap:wrap}
.nm{margin:0;color:#3d3d3d;font-size:1.3rem}
.acts{display:flex;gap:8px;flex-wrap:wrap}
#modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:12px}
.mb{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.md{position:relative;background:#fff;border-radius:8px;padding:18px;width:min(440px,100%);max-height:100%;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.md h3{margin:0 0 10px}.hint{margin:0 0 10px;color:#7c7c7c}
label{display:block;font-weight:700;margin-bottom:10px;font-size:.9rem}
input,textarea,select{display:block;width:100%;margin-top:4px;font:inherit;padding:8px;border:2px solid #e2e2e2;border-radius:6px;background:#fff;color:inherit}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.err{color:#d23b2f;font-size:.9rem;min-height:1.2em}
.tools,.dtools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools button,.tb,.dtools button:not(.sw){border:2px solid #e2e2e2;background:#fff;border-radius:999px;padding:4px 12px;font-weight:700;margin:0;font-size:.9rem;cursor:pointer}
[aria-pressed="true"]:not(.tile){border-color:#5cc100!important;background:#e9f7d9!important}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;outline:1px solid #ccc;padding:0}
.sw[aria-pressed="true"]{outline:3px solid #3d3d3d}
.dtools input[type=range]{width:90px;padding:0;margin:0;border:0}
canvas{display:block;width:100%;height:auto;border:2px solid #e2e2e2;border-radius:6px;touch-action:none;cursor:crosshair;background:#fff}
.pv{max-height:200px;object-fit:contain;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#3d3d3d;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:40;max-width:90%;text-align:center}
.avbox img{width:100%;height:100%;object-fit:cover;display:block}
.pa{display:flex;gap:6px;align-items:center;padding:6px 10px;border-top:1px solid #eee}
.yeah{border:2px solid #5cc100;background:#fff;color:#4aa300;border-radius:999px;padding:2px 14px;font-weight:700}
.yeah[aria-pressed="true"]{background:#5cc100!important;color:#fff}
.mini{background:none;border:0;color:#7c7c7c;font-weight:700;padding:2px 8px}
.rel{position:relative}
.badge{position:absolute;top:-2px;right:0;background:#e8413c;color:#fff;font-size:.7rem;line-height:1.4;border-radius:999px;min-width:18px;padding:0 5px;text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tabs button:not(.btn){background:#fff;border:2px solid #e2e2e2;border-radius:999px;padding:4px 16px;font-weight:700;color:#7c7c7c}
.tabs button.on{border-color:#5cc100;color:#4aa300;background:#e9f7d9}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e2e2e2;border-radius:999px;padding:3px 14px 3px 3px;font-weight:700;flex:none}
.chip .avbox{width:30px;height:30px;border-radius:50%}
.cm,.nt{display:flex;gap:10px;padding:10px;margin-bottom:8px;align-items:flex-start}.nt{align-items:center}
.ct{overflow-wrap:anywhere;white-space:pre-wrap}
.bio{flex-basis:100%;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
#mf2 textarea{margin-bottom:0}
</style>
</head>
<body>
<!--
  SETUP (takes about 5 minutes)
  1. console.firebase.google.com -> create a project -> add a Web app -> copy its config into FIREBASE_CONFIG below.
  2. Build -> Authentication -> Get started -> enable Email/Password.
  3. Build -> Firestore Database -> Create database -> Rules tab -> paste this and Publish:
       rules_version='2';
       service cloud.firestore{match /databases/{d}/documents{
         match /users/{u}{allow read:if true; allow write:if request.auth!=null&&request.auth.uid==u;}
         match /private/{u}{allow read,write:if request.auth!=null&&request.auth.uid==u;}
         match /{col}/{id}{
           allow read:if col!='private';
           allow create:if col in ['communities','posts','comments','yeahs','follows','favs']&&request.auth!=null&&request.resource.data.uid==request.auth.uid;
           allow delete:if col in ['posts','comments','yeahs','follows','favs']&&request.auth!=null&&resource.data.uid==request.auth.uid;}}}
  4. Host this file (Firebase Hosting, Netlify, GitHub Pages...) and add that domain under Authentication -> Settings -> Authorized domains.
-->
<header id="hd"></header>
<div class="page" id="app"></div>
<div id="modal" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
var FIREBASE_CONFIG={apiKey:"AIzaSyCRb1LKV3dtEHiLF-HN6r8ce9sTD-LrFCI",authDomain:"mediaversedata.firebaseapp.com",projectId:"mediaversedata",storageBucket:"mediaversedata.firebasestorage.app",messagingSenderId:"929912344439",appId:"1:929912344439:web:a187e738f4ef5b76ce5b72"};

var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var okImg=function(s){return typeof s==="string"&&/^data:image\/(jpeg|png);base64,[A-Za-z0-9+\/=]+$/.test(s)};
var fb=!!FIREBASE_CONFIG.apiKey&&typeof firebase!=="undefined",auth,db;
var user=null,coms=[],posts=[],view={t:"home"},q="",revealed={},menuOpen=false,authMode="login",cs={},users={},yeahs=[],cmts=[],follows=[],favs=[],feedTab="all",ctab="all",seen=0;

var LOGO='<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="currentColor"/><circle cx="11.5" cy="13" r="2.2" fill="#fff"/><circle cx="20.5" cy="13" r="2.2" fill="#fff"/><path d="M9.5 19q6.5 6 13 0" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>';
var IFEED='<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><rect x="3" y="9" width="20" height="18" rx="3"/><circle cx="10" cy="16" r="1" fill="currentColor"/><circle cx="16" cy="16" r="1" fill="currentColor"/><path d="M9 21q4 3 8 0M20 4q6 0 8 6M20 8q3 0 4 3"/></svg>';
var ICOM='<svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><circle cx="16" cy="9" r="5"/><path d="M7 28v-8a9 9 0 0 1 18 0v8z"/><circle cx="5" cy="13" r="3.5"/><path d="M0 24v-4a5 5 0 0 1 8-3.5V24z"/><circle cx="27" cy="13" r="3.5"/><path d="M32 24v-4a5 5 0 0 0-8-3.5V24z"/></svg>';
var ICHAT='<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M5 5h22v17H18l-4 5v-5H5z"/><path d="M10 11h12M10 16h12"/></svg>';
var IMENU='<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M4 8h20M4 16h20M4 24h20"/><path d="M27 12l3 0-1.5 3z" fill="currentColor" stroke-width="2"/></svg>';
var CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';

function hs(s){var h=0;s=String(s||"");for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function av(seed,gen){var us=users[seed];if(!gen&&us&&okImg(us.photo))return '<img src="'+us.photo+'" alt="">';return '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M4 40q2-10 16-10t16 10z" fill="#9aa"/><circle cx="20" cy="19" r="14" fill="hsl('+(hs(seed)%360)+',70%,70%)"/><ellipse cx="14.5" cy="17" rx="2" ry="3" fill="#3a2a2a"/><ellipse cx="25.5" cy="17" rx="2" ry="3" fill="#3a2a2a"/><path d="M14 22q6 6 12 0" stroke="#3a2a2a" stroke-width="2" fill="none" stroke-linecap="round"/></svg>'}
function grad(s){var h=hs(s)%360;return "linear-gradient(135deg,hsl("+h+",65%,52%),hsl("+((h+50)%360)+",70%,42%))"}
function ago(t){var d=t&&t.toDate?t.toDate():new Date(),s=(Date.now()-d)/1000;if(s<60)return "just now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago"}
function cn(id){var c=coms.find(function(x){return x.id===id});return c?c.name:"a community"}
var tt;function toast(m){var t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2600)}

/* ---------- helpers ---------- */
function ts(){return firebase.firestore.FieldValue.serverTimestamp()}
var rt;function rq(){clearTimeout(rt);rt=setTimeout(render,40)}
function ms(t){return t&&t.toMillis?t.toMillis():Date.now()}
function un(uid,f){var u=users[uid];return esc((u&&u.name)||(user&&user.uid===uid&&user.displayName)||f||"Player")}
function yn(pid){return yeahs.filter(function(y){return y.pid===pid}).length}
function myY(pid){return !!user&&yeahs.some(function(y){return y.pid===pid&&y.uid===user.uid})}
function ncm(pid){return cmts.filter(function(c){return c.pid===pid}).length}
function isF(uid){return !!user&&follows.some(function(f){return f.uid===user.uid&&f.to===uid})}
function isFav(cid){return !!user&&favs.some(function(f){return f.uid===user.uid&&f.cid===cid})}
function notes(){
  if(!user)return[];var me=user.uid,n=[];
  yeahs.forEach(function(y){if(y.to===me&&y.uid!==me)n.push({t:"y",uid:y.uid,pid:y.pid,at:y.created})});
  cmts.forEach(function(c){if(c.to===me&&c.uid!==me)n.push({t:"c",uid:c.uid,pid:c.pid,at:c.created})});
  follows.forEach(function(f){if(f.to===me)n.push({t:"f",uid:f.uid,at:f.created})});
  return n.sort(function(a,b){return ms(b.at)-ms(a.at)});
}
function nCount(){return notes().filter(function(n){return ms(n.at)>seen}).length}
function yb(p){return '<button class="yeah" data-a="yeah" data-id="'+esc(p.id)+'" aria-pressed="'+myY(p.id)+'">Yeah! '+yn(p.id)+'</button><button class="mini" data-a="opost" data-id="'+esc(p.id)+'" aria-label="Comments">💬 '+ncm(p.id)+'</button>'+(user&&user.uid===p.uid?'<button class="mini" data-a="delp" data-id="'+esc(p.id)+'" aria-label="Delete post">🗑️</button>':"")}
function cmH(c){return '<div class="card cm"><span class="avbox">'+av(c.uid)+'</span><div class="tx"><button class="lk" data-a="prof" data-id="'+esc(c.uid)+'">'+un(c.uid,c.name)+'</button> <span class="sub">'+ago(c.created)+'</span>'+(user&&user.uid===c.uid?' <button class="mini" data-a="delc" data-id="'+esc(c.id)+'" aria-label="Delete comment">🗑️</button>':"")+'<div class="ct">'+esc(c.text)+'</div></div></div>'}
function nh(n){
  var who='<button class="lk" data-a="prof" data-id="'+esc(n.uid)+'">'+un(n.uid)+'</button>';
  var tx=n.t==="f"?who+" followed you.":who+(n.t==="y"?" gave your post a Yeah!":" commented on your post.");
  return '<div class="card nt"><span class="avbox">'+av(n.uid)+'</span><div class="tx">'+tx+' <span class="sub">'+ago(n.at)+'</span></div>'+(n.pid?'<button class="mini" data-a="opost" data-id="'+esc(n.pid)+'">View</button>':"")+'</div>';
}
function myFav(){
  if(!user)return '<div class="none">Log in to favorite communities.</div>';
  var l=coms.filter(function(c){return isFav(c.id)});
  return l.length?tileList(l):'<div class="none">Open a community and tap ⭐ to add it here.</div>';
}
function people(){
  if(!q)return "";
  var l=Object.keys(users).filter(function(u){return (users[u].name||"").toLowerCase().indexOf(q)>=0}).slice(0,8);
  return l.length?'<h2>People</h2><div class="favs">'+l.map(function(u){return '<button class="chip" data-a="prof" data-id="'+esc(u)+'"><span class="avbox">'+av(u)+'</span>'+un(u)+'</button>'}).join("")+'</div>':"";
}

/* ---------- header ---------- */
function hdr(){
  var v=view.t,u=user,h='<div class="bar"><button class="logo" data-a="home">'+LOGO+'Mediaverse</button>';
  h+=u?'<button data-a="user"'+(v==="u"&&view.id===u.uid?' class="on"':'')+'><span class="avbox">'+av(u.uid)+'</span><span class="lbl">User Page</span></button>'
      :'<button class="pill" data-a="signup">Sign up</button><button class="pill fill" data-a="login">Log in</button>';
  h+='<button data-a="feed"'+(v==="feed"?' class="on"':'')+' aria-label="Activity Feed">'+IFEED+'<span class="lbl">Activity Feed</span></button>'
    +'<button data-a="home"'+(v==="home"||v==="c"?' class="on"':'')+' aria-label="Communities">'+ICOM+'<span class="lbl">Communities</span></button>'
    +'<button data-a="notes" class="rel'+(v==="n"?' on':'')+'" aria-label="Notifications">'+ICHAT+(nCount()?'<span class="badge">'+nCount()+'</span>':"")+'</button>'
    +'<div class="mw"><button data-a="menu" aria-label="Menu" aria-expanded="'+menuOpen+'">'+IMENU+'</button>'
    +(menuOpen?'<div class="dd">'+(u?'<button data-a="addcom">Add community</button><button data-a="logout">Log out</button>':'<button data-a="signup">Sign up</button><button data-a="login">Log in</button>')+'</div>':'')+'</div></div>';
  $("hd").innerHTML=h;
}

/* ---------- pieces ---------- */
function tileList(l){return l.map(function(c){return '<button class="tile" data-a="open" data-id="'+esc(c.id)+'" title="'+esc(c.name)+'" aria-label="'+esc(c.name)+'" style="background:'+grad(c.name)+'">'+esc(c.emoji||"🌟")+'</button>'}).join("")}
function tiles(){
  if(!coms.length)return '<div class="none">No communities yet.</div>';
  var l=coms.filter(function(c){return !q||c.name.toLowerCase().indexOf(q)>=0});
  return l.length?tileList(l):'<div class="none">No communities match.</div>';
}
function art(c){
  var lp=posts.find(function(p){return p.cid===c.id&&p.text&&!p.spoiler});
  return '<div class="art" style="background:'+grad(c.name)+'"><span class="big" aria-hidden="true">'+esc(c.emoji||"🌟")+'</span>'+(lp?'<div class="say"><span class="avbox">'+av(lp.uid)+'</span><div class="bub">'+esc(lp.text)+'</div></div>':'')+'</div>';
}
function infoH(c,btn){return '<div class="info"><span class="ico" style="background:'+grad(c.name)+'">'+esc(c.emoji||"🌟")+'</span><div class="tx"><b>'+esc(c.name)+'</b><span class="sub">'+esc(c.desc||"")+'</span></div>'+btn+'</div>'}
function postH(p){
  var ins=(okImg(p.draw)?'<img class="paper" src="'+p.draw+'" alt="Drawing">':'')+(okImg(p.img)?'<img class="paper" src="'+p.img+'" alt="Picture">':'')+(p.text?'<p>'+esc(p.text)+'</p>':'');
  var sp=p.spoiler&&!revealed[p.id];
  return '<article class="dw"><span class="avbox">'+av(p.uid)+'</span><div class="bubble"><div class="in"><div class="body'+(sp?' sp':'')+'" data-sp="'+esc(p.id)+'"><div class="inner">'+ins+'</div><div class="spov">Spoiler! Click to see this post</div></div><div class="pa">'+yb(p)+'</div><div class="foot"><b><button class="lk" data-a="prof" data-id="'+esc(p.uid)+'">'+un(p.uid,p.name)+'</button></b> in <button class="lk" data-a="open" data-id="'+esc(p.cid)+'">'+esc(cn(p.cid))+'</button> · '+ago(p.created)+'</div></div></div></article>';
}
function list(a,empty){return a.length?a.map(postH).join(""):'<div class="none card">'+empty+'</div>'}

/* ---------- views ---------- */
function render(){
  var v=view,h="",ae=document.activeElement,kid=ae&&(ae.id==="mt"||ae.id==="q")?ae.id:"",kv=kid?ae.value:"";
  if(v.t==="home"){
    var c=coms[0],dr=posts.filter(function(p){return okImg(p.draw)}).slice(0,5);
    h='<main>'+(c?'<section class="hero">'+art(c)+infoH(c,'<button class="chev" data-a="open" data-id="'+esc(c.id)+'" aria-label="Open community">'+CHEV+'</button>')+'</section>'
        :'<section class="hero"><div class="none">There are no communities yet.<br><br><button class="btn" data-a="addcom">+ Add community</button></div></section>')
      +'<h2>⭐ Favorite Communities</h2><div class="favs">'+myFav()+'</div><h2>All Communities</h2><div class="favs" id="favs">'+tiles()+'</div><div id="ppl">'+people()+'</div></main>'
      +'<aside><div class="search"><input id="q" type="search" placeholder="Search communities and people" aria-label="Search communities and people" autocomplete="off" value="'+esc(q)+'"></div>'
      +'<button class="news" data-a="feed"><span class="avbox">'+av("news")+'</span><span><b>Get the latest news here!</b>See the newest posts</span></button>'
      +'<h2>✏️ Featured Drawings</h2>'+(dr.length?dr.map(postH).join(""):'<div class="none card">No drawings yet.<br><br><button class="btn" data-a="draw">🎨 Draw something</button></div>')+'</aside>';
  }else if(v.t==="feed"){
    var fl=feedTab==="following"&&user?posts.filter(function(p){return p.uid===user.uid||isF(p.uid)}):posts;
    h='<main class="one"><div class="tabs"><button class="'+(feedTab==="all"?"on":"")+'" data-a="ftab" data-id="all">Everyone</button><button class="'+(feedTab==="following"?"on":"")+'" data-a="ftab" data-id="following">Following</button><button class="btn" data-a="post" style="margin-left:auto">+ New post</button></div>'
      +list(fl,feedTab==="following"?"Nothing here yet. Follow people to see their posts.":"There are no posts yet.")+'</main>';
  }else if(v.t==="c"){
    var cc2=coms.find(function(x){return x.id===v.id});
    if(!cc2){view={t:"home"};return render()}
    var cp=posts.filter(function(p){return p.cid===cc2.id&&(ctab!=="draw"||okImg(p.draw))});
    h='<main class="one"><section class="hero">'+art(cc2)+infoH(cc2,'<button class="ghost" data-a="fav" data-id="'+esc(cc2.id)+'" aria-pressed="'+isFav(cc2.id)+'" aria-label="Favorite">⭐</button><button class="btn" data-a="post" data-id="'+esc(cc2.id)+'">+ New post</button>')+'</section>'
      +'<div class="tabs"><button class="'+(ctab==="all"?"on":"")+'" data-a="ctab" data-id="all">All posts</button><button class="'+(ctab==="draw"?"on":"")+'" data-a="ctab" data-id="draw">Drawings</button></div>'
      +list(cp,"No posts here yet.")+'</main>';
  }else if(v.t==="p"){
    var pp=posts.find(function(p){return p.id===v.id});
    if(!pp){view={t:"home"};return render()}
    var cl=cmts.filter(function(c){return c.pid===pp.id}).reverse();
    h='<main class="one">'+postH(pp)+'<h2>Comments</h2>'+(cl.length?cl.map(cmH).join(""):'<div class="none card">No comments yet.</div>')
      +(user?'<form id="cmf"><textarea id="mt" maxlength="200" placeholder="Write a comment…" aria-label="Comment"></textarea><div class="row"><button class="btn">Comment</button></div></form>':'<div class="none card"><button class="btn" data-a="login">Log in to comment</button></div>')+'</main>';
  }else if(v.t==="n"){
    h='<main class="one"><h2>Notifications</h2>'+(!user?'<div class="none card">Log in to see your notifications.</div>':notes().length?notes().map(nh).join(""):'<div class="none card">No notifications yet.</div>')+'</main>';
  }else{
    var uid=v.id,us=users[uid]||{},own=!!user&&user.uid===uid,fp=posts.find(function(p){return p.uid===uid}),
      mc=coms.filter(function(x){return x.uid===uid}),mp=posts.filter(function(p){return p.uid===uid}),
      fr=follows.filter(function(f){return f.to===uid}).length,fg=follows.filter(function(f){return f.uid===uid}).length,
      yy=yeahs.filter(function(y){return y.to===uid}).length;
    h='<main class="one"><div class="card prof"><span class="avbox lg">'+av(uid)+'</span><div class="tx"><h2 class="nm">'+un(uid,fp&&fp.name)+'</h2><span class="sub">'+fr+' followers · '+fg+' following · '+yy+' Yeahs</span></div>'
      +'<div class="acts">'+(own?'<button class="btn" data-a="edit">Edit profile</button><button class="btn" data-a="addcom">+ Add community</button><button class="btn" data-a="post">+ New post</button>':'<button class="btn" data-a="follow" data-id="'+esc(uid)+'">'+(isF(uid)?"Following ✓":"Follow")+'</button>')+'</div>'
      +'<p class="bio">'+(us.bio?esc(us.bio):'<span class="sub">No description yet.</span>')+'</p></div>'
      +'<h2>Communities</h2><div class="favs">'+(mc.length?tileList(mc):'<div class="none">No communities yet.</div>')+'</div><h2>Posts</h2>'+list(mp,"No posts yet.")+'</main>';
  }
  $("app").innerHTML=h;hdr();
  if(kid&&$(kid)){$(kid).value=kv;$(kid).focus()}
}

/* ---------- modals ---------- */
function modal(h){var m=$("modal");m.innerHTML='<div class="mb" data-a="close"></div><div class="md" role="dialog" aria-modal="true">'+h+'</div>';m.hidden=false;var f=m.querySelector("input:not([hidden]),textarea,select");if(f)f.focus()}
function closeModal(){$("modal").hidden=true;$("modal").innerHTML=""}
function info(t,m){modal('<h3>'+t+'</h3><p>'+m+'</p><div class="row"><button class="btn" data-a="close">OK</button></div>')}
function noFb(){info("Firebase isn’t connected yet","Open this file in a text editor and paste your Firebase config into <b>FIREBASE_CONFIG</b> near the bottom (the setup steps are in the comment at the top), then reload.")}
function need(why,fn){if(!fb)return noFb();if(!user)return authM("login","You need an account to "+why+".");fn()}
function emsg(x){var m={"auth/email-already-in-use":"That username is taken.","auth/weak-password":"The password needs at least 6 characters.","auth/invalid-email":"That username doesn’t look right.","auth/invalid-credential":"Wrong username or password.","auth/user-not-found":"Wrong username or password.","auth/wrong-password":"Wrong username or password."};return m[x.code]||x.message}

function authM(mode,msg){
  authMode=mode;var s=mode==="signup";
  modal('<h3>'+(s?'Sign up':'Log in')+'</h3>'+(msg?'<p class="hint">'+esc(msg)+'</p>':'')+'<form id="af">'+'<label>Username<input id="au" maxlength="20" required autocomplete="username"></label>'+(s?'<label>Email (optional)<input id="ae" type="email" autocomplete="email"><span class="sub" style="font-weight:400">Only you can see it. It can’t be used to log in.</span></label>':"")+'<label>Password<input id="ap" type="password" minlength="6" required autocomplete="'+(s?'new-password':'current-password')+'"></label><div class="err" id="aer" role="alert"></div><div class="row"><button type="button" class="ghost" data-a="'+(s?'login':'signup')+'">'+(s?'I have an account':'Create account')+'</button><button class="btn">'+(s?'Sign up':'Log in')+'</button></div></form>');
}
function comM(){
  modal('<h3>Add community</h3><form id="cf"><label>Name<input id="cname" maxlength="40" required></label><label>Description<input id="cdesc" maxlength="120"></label><label>Icon (an emoji)<input id="cemo" maxlength="4" value="🌟"></label><div class="err" id="cer" role="alert"></div><div class="row"><button type="button" class="ghost" data-a="close">Cancel</button><button class="btn">Create</button></div></form>');
}
function postM(o){
  o=o||{};
  if(!coms.length)return info("No communities yet","Add a community first, then you can post in it.");
  cs={draw:!!o.draw,spoil:false,img:null,drawn:false,tool:"pen",col:"#222222",size:4};
  var sel=o.cid||(view.t==="c"?view.id:coms[0].id),cols=["#222222","#e8413c","#2fa0e0","#5cc100","#f5a21d","#8a4fff"];
  modal('<h3>New post</h3><form id="pf"><label>Community<select id="pc">'+coms.map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===sel?' selected':'')+'>'+esc(c.name)+'</option>'}).join("")+'</select></label>'
    +'<label>Text<textarea id="pt" maxlength="300" placeholder="Say something…"></textarea></label>'
    +'<div class="tools"><button type="button" data-a="tdraw" aria-pressed="'+cs.draw+'">🎨 Draw</button><label class="tb">🖼️ Add image<input type="file" id="pi" accept="image/*" hidden></label><button type="button" data-a="tspoil" aria-pressed="false">⚠️ Spoiler</button></div>'
    +'<img id="pp" class="paper pv" alt="Picture preview" hidden>'
    +'<div id="dbox"'+(cs.draw?'':' hidden')+'><div class="dtools"><button type="button" data-a="tool" data-id="pen" aria-pressed="true">✏️ Pen</button><button type="button" data-a="tool" data-id="eraser" aria-pressed="false">🧽 Eraser</button><button type="button" data-a="tool" data-id="text" aria-pressed="false">🔤 Text</button><button type="button" data-a="clear">Clear</button></div>'
    +'<div class="dtools">'+cols.map(function(c,i){return '<button type="button" class="sw" data-a="col" data-id="'+c+'" style="background:'+c+'" aria-label="Color '+(i+1)+'" aria-pressed="'+(i===0)+'"></button>'}).join("")+'<input type="range" id="ds" min="2" max="16" value="4" aria-label="Brush size"></div>'
    +'<input id="dt" maxlength="40" placeholder="Text for the drawing: pick Text, then tap the canvas" aria-label="Text for the drawing" style="margin:0 0 8px"><canvas id="cv" width="360" height="220"></canvas></div>'
    +'<div class="row"><button type="button" class="ghost" data-a="close">Cancel</button><button class="btn">Post</button></div></form>');
  cvInit();
  $("pi").onchange=function(){
    var f=this.files[0];if(!f)return;var im=new Image();
    im.onload=function(){var s=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);cs.img=c.toDataURL("image/jpeg",.7);$("pp").src=cs.img;$("pp").hidden=false;URL.revokeObjectURL(im.src)};
    im.onerror=function(){toast("That file couldn’t be read as a picture.")};
    im.src=URL.createObjectURL(f);
  };
}
function editM(){
  var u=users[user.uid]||{};cs={photo:u.photo||""};
  modal('<h3>Edit profile</h3><form id="ef"><div class="acts" style="align-items:center;margin-bottom:12px"><span class="avbox lg" id="ep">'+av(user.uid)+'</span><label class="tb" style="margin:0">Change picture<input type="file" id="pif" accept="image/*" hidden></label><button type="button" class="ghost" data-a="rmph">Remove</button></div><label>Name<input id="en" maxlength="20" required value="'+un(user.uid)+'"></label><label>Description<textarea id="eb" maxlength="200" placeholder="Tell people about yourself…">'+esc(u.bio||"")+'</textarea></label><div class="err" id="eer" role="alert"></div><div class="row"><button type="button" class="ghost" data-a="close">Cancel</button><button class="btn">Save</button></div></form>');
  $("pif").onchange=function(){
    var f=this.files[0];if(!f)return;var im=new Image();
    im.onload=function(){var s=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=128;c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);cs.photo=c.toDataURL("image/jpeg",.8);$("ep").innerHTML='<img src="'+cs.photo+'" alt="">';URL.revokeObjectURL(im.src)};
    im.onerror=function(){toast("That file couldn’t be read as a picture.")};
    im.src=URL.createObjectURL(f);
  };
}
function cvInit(){
  var cv=$("cv"),x=cv.getContext("2d"),down=false,lx,ly;
  x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.lineCap=x.lineJoin="round";
  function pt(e){var r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]}
  function seg(a,b,c,d){var er=cs.tool==="eraser";x.strokeStyle=er?"#fff":cs.col;x.lineWidth=er?cs.size*3:cs.size;x.beginPath();x.moveTo(a,b);x.lineTo(c,d+.01);x.stroke();if(!er)cs.drawn=true}
  cv.onpointerdown=function(e){
    var p=pt(e);
    if(cs.tool==="text"){var s=$("dt").value;if(!s)return toast("Type some text first.");x.fillStyle=cs.col;x.font="bold "+(cs.size*2+16)+"px Arial,sans-serif";x.fillText(s,p[0],p[1]);cs.drawn=true;return}
    down=true;lx=p[0];ly=p[1];cv.setPointerCapture(e.pointerId);seg(lx,ly,lx,ly);
  };
  cv.onpointermove=function(e){if(!down)return;var p=pt(e);seg(lx,ly,p[0],p[1]);lx=p[0];ly=p[1]};
  cv.onpointerup=cv.onpointercancel=function(){down=false};
  cv.clearAll=function(){x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);cs.drawn=false};
}

/* ---------- events ---------- */
function go(v){view=v;render();window.scrollTo(0,0)}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-a]"),s=e.target.closest(".sp");
  if(menuOpen&&!(t&&t.dataset.a==="menu")){menuOpen=false;hdr()}
  if(!t){if(s){revealed[s.dataset.sp]=1;render()}return}
  var a=t.dataset.a,id=t.dataset.id;
  if(a==="home")go({t:"home"});
  else if(a==="feed")go({t:"feed"});
  else if(a==="user"){if(user)go({t:"u",id:user.uid});else authM("login")}
  else if(a==="open"){ctab="all";go({t:"c",id:id})}
  else if(a==="signup"||a==="login"){if(fb)authM(a);else noFb()}
  else if(a==="menu"){menuOpen=!menuOpen;hdr()}
  else if(a==="logout"){auth.signOut();go({t:"home"})}
  else if(a==="addcom")need("add a community",comM);
  else if(a==="post")need("post",function(){postM({cid:id})});
  else if(a==="draw")need("draw",function(){postM({draw:true})});
  else if(a==="prof")go({t:"u",id:id});
  else if(a==="opost")go({t:"p",id:id});
  else if(a==="notes"){if(!user){if(fb)authM("login","You need an account to see notifications.");else noFb()}else{seen=Date.now();try{localStorage.setItem("mv_seen_"+user.uid,seen)}catch(x){}go({t:"n"})}}
  else if(a==="yeah")need("give a Yeah",function(){
    var p=posts.find(function(z){return z.id===id}),r=db.collection("yeahs").doc(id+"_"+user.uid);
    (myY(id)?r.delete():r.set({pid:id,uid:user.uid,to:p?p.uid:"",created:ts()})).catch(function(x){toast(x.message)});
  });
  else if(a==="follow")need("follow people",function(){
    var r=db.collection("follows").doc(user.uid+"_"+id);
    (isF(id)?r.delete():r.set({uid:user.uid,to:id,created:ts()})).catch(function(x){toast(x.message)});
  });
  else if(a==="fav")need("favorite a community",function(){
    var r=db.collection("favs").doc(user.uid+"_"+id);
    (isFav(id)?r.delete():r.set({uid:user.uid,cid:id})).catch(function(x){toast(x.message)});
  });
  else if(a==="edit")need("edit your profile",editM);
  else if(a==="rmph"){cs.photo="";$("ep").innerHTML=av(user.uid,1)}
  else if(a==="delp"){if(confirm("Delete this post?"))db.collection("posts").doc(id).delete().then(function(){toast("Post deleted.")}).catch(function(x){toast(x.message)})}
  else if(a==="delc")db.collection("comments").doc(id).delete().catch(function(x){toast(x.message)});
  else if(a==="ftab"){if(id==="following")need("see posts from people you follow",function(){feedTab=id;render()});else{feedTab=id;render()}}
  else if(a==="ctab"){ctab=id;render()}
  else if(a==="close")closeModal();
  else if(a==="tdraw"){cs.draw=!cs.draw;t.setAttribute("aria-pressed",cs.draw);$("dbox").hidden=!cs.draw}
  else if(a==="tspoil"){cs.spoil=!cs.spoil;t.setAttribute("aria-pressed",cs.spoil)}
  else if(a==="tool"){cs.tool=id;document.querySelectorAll('[data-a="tool"]').forEach(function(b){b.setAttribute("aria-pressed",b===t)})}
  else if(a==="col"){cs.col=id;document.querySelectorAll('[data-a="col"]').forEach(function(b){b.setAttribute("aria-pressed",b===t)})}
  else if(a==="clear")$("cv").clearAll();
});
document.addEventListener("input",function(e){
  if(e.target.id==="q"){q=e.target.value.trim().toLowerCase();$("favs").innerHTML=tiles();$("ppl").innerHTML=people()}
  if(e.target.id==="ds")cs.size=+e.target.value;
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});
document.addEventListener("submit",function(e){
  e.preventDefault();var id=e.target.id,b=e.target.querySelector(".btn");
  if(!fb)return noFb();
  if(id==="af"){
    var nm=$("au").value.trim(),pw=$("ap").value,em=nm.indexOf("@")>0?nm:nm.toLowerCase()+"@mediaverse.example.com";if(authMode==="signup"&&!/^[A-Za-z0-9_.-]{3,20}$/.test(nm)){$("aer").textContent="Usernames are 3 to 20 letters, numbers, dots, dashes or underscores.";return}b.disabled=true;
    var pr=authMode==="signup"
      ?auth.createUserWithEmailAndPassword(em,pw).then(function(c){var oe=$("ae").value.trim();return c.user.updateProfile({displayName:nm}).then(function(){user=auth.currentUser;return Promise.all([db.collection("users").doc(c.user.uid).set({name:nm,bio:"",photo:"",created:ts()}),oe?db.collection("private").doc(c.user.uid).set({email:oe}):0]).catch(function(){})})})
      :auth.signInWithEmailAndPassword(em,pw);
    pr.then(function(){closeModal();render()}).catch(function(x){b.disabled=false;$("aer").textContent=emsg(x)});
  }else if(id==="cf"){
    b.disabled=true;
    db.collection("communities").add({name:$("cname").value.trim(),desc:$("cdesc").value.trim(),emoji:$("cemo").value.trim()||"🌟",uid:user.uid,owner:user.displayName||"Player",created:firebase.firestore.FieldValue.serverTimestamp()})
      .then(function(){closeModal();toast("Community created!")}).catch(function(x){b.disabled=false;$("cer").textContent=x.message});
  }else if(id==="ef"){
    b.disabled=true;
    db.collection("users").doc(user.uid).set({name:$("en").value.trim(),bio:$("eb").value.trim(),photo:cs.photo||""},{merge:true})
      .then(function(){closeModal();toast("Profile saved!")}).catch(function(x){b.disabled=false;$("eer").textContent=x.message});
  }else if(id==="cmf"){
    var tx=$("mt").value.trim();if(!tx)return;
    var pp=posts.find(function(z){return z.id===view.id});b.disabled=true;
    db.collection("comments").add({pid:view.id,text:tx,uid:user.uid,name:user.displayName||"Player",to:pp?pp.uid:"",created:ts()})
      .then(function(){var m=$("mt");if(m)m.value="";b.disabled=false}).catch(function(x){b.disabled=false;toast(x.message)});
  }else if(id==="pf"){
    var t=$("pt").value.trim(),dr=cs.draw&&cs.drawn?$("cv").toDataURL("image/jpeg",.7):null;
    if(!t&&!dr&&!cs.img)return toast("Add some text, a drawing or a picture first.");
    b.disabled=true;
    db.collection("posts").add({cid:$("pc").value,text:t,draw:dr,img:cs.img,spoiler:cs.spoil,uid:user.uid,name:user.displayName||"Player",created:firebase.firestore.FieldValue.serverTimestamp()})
      .then(function(){closeModal();toast("Posted!")}).catch(function(x){b.disabled=false;toast(x.message)});
  }
});

/* ---------- firebase ---------- */
function mk(d){return Object.assign({id:d.id},d.data())}
function fe(x){toast("Couldn’t load data: "+x.message)}
if(fb){
  firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
  auth.onAuthStateChanged(function(u){user=u;try{seen=u?+localStorage.getItem("mv_seen_"+u.uid)||0:0}catch(x){}rq()});
  var L=function(col,n,fn,desc){var r=db.collection(col);if(desc)r=r.orderBy("created","desc");r.limit(n).onSnapshot(function(s){fn(s.docs.map(mk));rq()},fe)};
  L("communities",60,function(a){coms=a},1);
  L("posts",150,function(a){posts=a},1);
  L("comments",500,function(a){cmts=a},1);
  L("yeahs",1000,function(a){yeahs=a},1);
  L("follows",1000,function(a){follows=a},1);
  L("favs",500,function(a){favs=a});
  L("users",300,function(a){users={};a.forEach(function(u){users[u.id]=u})});
}
render();
