function gate(s){
  if(!s||!user)return s;
  if(rx("sex").test(s)){selfBan("term","Inappropriate content.");return null}
  if(rx("thr").test(s)){pts(-1);ban8("Death threats and bullying aren’t allowed.");return null}
  if(rx("mean").test(s)){pts(-1);toast("Bullying isn’t allowed here. You lost 1 kindness point.");return null}
  if(rx("bad").test(s)){ban8("Bad language isn’t allowed.");return s.replace(rx("bad",1),function(w){return w[0]+new Array(w.length).join("*")})}
  if(rx("nice").test(s)){pts(1);toast("Kind words! +1 kindness point")}
  return s;
}

    (isFav(id)?r.delete():r.set({uid:user.uid,cid:id})).catch(function(x){toast(x.message)});
  });
  else if(a==="edit")need("edit your profile",editM);
  else if(a==="rmph"){cs.photo="";$("ep").innerHTML=av(user.uid,1)}
  else if(a==="delp"){if(confirm("Delete this post?"))db.collection("posts").doc(id).delete().then(function(){toast("Post deleted.")}).catch(function(x){toast(x.message)})}
  else if(a==="delc")db.collection("comments").doc(id).delete().catch(function(x){toast(x.message)});
  else if(a==="ftab"){if(id==="following")need("see posts from people you follow",function(){feedTab=id;render()});else{feedTab=id;render()}}
  else if(a==="ctab"){ctab=id;render()}
  else if(a==="msgs")need("send messages",function(){go({t:"m"})});
  else if(a==="msgto")go({t:"m",id:id});
  else if(a==="simg")$("sfi").click();
  else if(a==="gifts")$("gf").hidden=!$("gf").hidden;
  else if(a==="gift"){sendM({t:"gift",g:id});$("gf").hidden=true}
  else if(a==="call")startCall(view.id,id);
  else if(a==="hang")endCall(true);
  else if(a==="acc")acceptCall();
  else if(a==="dec"){if(incoming.d)db.collection("calls").doc(pair(user.uid,incoming.d.from)).update({state:"ended"}).catch(function(){});callUI("")}
  else if(a==="addf")need("send friend requests",function(){var p1=user.uid<id?user.uid:id,p2=user.uid<id?id:user.uid;db.collection("friends").doc(p1+"_"+p2).set({a:p1,b:p2,from:user.uid,to:id,status:"pending",created:ts()}).then(function(){toast("Friend request sent!")}).catch(function(x){toast(x.message)})});
  else if(a==="accf")need("accept friend requests",function(){db.collection("friends").doc(pair(user.uid,id)).update({status:"ok"}).then(function(){toast("You’re friends now!")}).catch(function(x){toast(x.message)})});
  else if(a==="unf")need("manage friends",function(){db.collection("friends").doc(pair(user.uid,id)).delete().catch(function(x){toast(x.message)})});
  else if(a==="tour")go({t:"tl"});
  else if(a==="newt")need("create a tournament",tourM);
  else if(a==="otour")go({t:"t",id:id});
  else if(a==="delt"){if(confirm("Delete this tournament?"))db.collection("tournaments").doc(id).delete().then(function(){go({t:"tl"})}).catch(function(x){toast(x.message)})}
  else if(a==="settings")need("open settings",function(){go({t:"set"})});
  else if(a==="adm")go({t:"adm"});
  else if(a==="lift"){var lu=findU($("bu").value);if(!lu)$("ber").textContent="No user found with that username. They may need to log in once first.";else db.collection("bans").doc(lu).delete().then(function(){$("ber").style.color="#3a9000";$("ber").textContent="Ban lifted for "+un(lu)+"."}).catch(function(x){$("ber").textContent=x.message})}
  else if(a==="deact"){if(confirm("Deactivate your account? Nobody will be able to find it until you reactivate."))db.collection("users").doc(user.uid).set({off:true},{merge:true}).then(function(){toast("Account deactivated.")}).catch(function(x){toast(x.message)})}
  else if(a==="react")db.collection("users").doc(user.uid).set({off:false},{merge:true}).then(function(){toast("Welcome back! Your account is active again.")}).catch(function(x){toast(x.message)});
  else if(a==="close")closeModal();
  else if(a==="tdraw"){cs.draw=!cs.draw;t.setAttribute("aria-pressed",cs.draw);$("dbox").hidden=!cs.draw}
  else if(a==="tspoil"){cs.spoil=!cs.spoil;t.setAttribute("aria-pressed",cs.spoil)}
  else if(a==="tool"){cs.tool=id;document.querySelectorAll('[data-a="tool"]').forEach(function(b){b.setAttribute("aria-pressed",b===t)})}
  else if(a==="col"){cs.col=id;document.querySelectorAll('[data-a="col"]').forEach(function(b){b.setAttribute("aria-pressed",b===t)})}
  else if(a==="clear")$("cv").clearAll();
});
document.addEventListener("input",function(e){
  if(e.target.id==="q"){q=e.target.value.trim().toLowerCase();$("favs").innerHTML=tiles();$("ppl").innerHTML=people()}
  if(e.target.id==="ds")cs.size=+e.target.value;
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});
document.addEventListener("submit",function(e){
  e.preventDefault();var id=e.target.id,b=e.target.querySelector(".btn");
  if(!fb)return noFb();
  if(id==="af"){
    var nm=$("au").value.trim(),pw=$("ap").value,em=nm.indexOf("@")>0?nm:nm.toLowerCase()+"@mediaverse.example.com";if(authMode==="signup"&&!/^[A-Za-z0-9_.-]{3,20}$/.test(nm)){$("aer").textContent="Usernames are 3 to 20 letters, numbers, dots, dashes or underscores.";return}b.disabled=true;
    var pr=authMode==="signup"
      ?auth.createUserWithEmailAndPassword(em,pw).then(function(c){var oe=$("ae").value.trim();return c.user.updateProfile({displayName:nm}).then(function(){user=auth.currentUser;return Promise.all([db.collection("users").doc(c.user.uid).set({name:nm,uname:nm,ul:nm.toLowerCase(),bio:"",photo:"",created:ts()}),oe?db.collection("private").doc(c.user.uid).set({email:oe}):Promise.resolve()])})})
      :auth.signInWithEmailAndPassword(em,pw);
    pr.then(function(){closeModal();render()}).catch(function(x){b.disabled=false;$("aer").textContent=emsg(x)});
  }else if(id==="cf"){var cn1=gate($("cname").value.trim()),cd1=gate($("cdesc").value.trim());if(cn1===null||cd1===null)return;
    b.disabled=true;
    db.collection("communities").add({name:cn1,desc:cd1,emoji:$("cemo").value.trim()||"🌟",img:cs.img||null,uid:user.uid,owner:user.displayName||"Player",created:firebase.firestore.FieldValue.serverTimestamp()})
      .then(function(){closeModal();toast("Community created!")}).catch(function(x){b.disabled=false;$("cer").textContent=x.message});
  }else if(id==="ef"){var nn=gate($("en").value.trim()),bb=gate($("eb").value.trim());if(nn===null||bb===null)return;
    b.disabled=true;
    db.collection("users").doc(user.uid).set({name:nn||$("en").value.trim(),bio:bb,photo:cs.photo||""},{merge:true})
      .then(function(){closeModal();toast("Profile saved!")}).catch(function(x){b.disabled=false;$("eer").textContent=x.message});
  }else if(id==="cmf"){
    var tx=gate($("mt").value.trim());if(!tx)return;
    var pp=posts.find(function(z){return z.id===view.id})||tours.find(function(z){return z.id===view.id});b.disabled=true;
    db.collection("comments").add({pid:view.id,text:tx,uid:user.uid,name:user.displayName||"Player",to:pp?pp.uid:"",created:ts()})
      .then(function(){var m=$("mt");if(m)m.value="";b.disabled=false}).catch(function(x){b.disabled=false;toast(x.message)});
  }else if(id==="bf"){
    var tu=findU($("bu").value);if(!tu){$("ber").textContent="No user found with that username. They may need to log in once first.";return}
    var sel=$("bl").value,o={by:"MediaVerse",msg:$("bm").value.trim(),created:ts()};
    if(sel==="t"){o.kind="term";o.label="Terminated"}
    else{var dd=DUR[+sel],dt=new Date();if(dd[2]==="d")dt.setDate(dt.getDate()+dd[1]);else if(dd[2]==="m")dt.setMonth(dt.getMonth()+dd[1]);else dt.setFullYear(dt.getFullYear()+dd[1]);o.kind="temp";o.until=firebase.firestore.Timestamp.fromDate(dt);o.label=dd[0]}
    db.collection("bans").doc(tu).set(o).then(function(){$("ber").style.color="#3a9000";$("ber").textContent="Done: "+o.label+" applied to "+un(tu)+"."}).catch(function(x){console.error("Ban write failed:",x);$("ber").textContent=x.code==="permission-denied"?"Permission denied. Firestore Rules must authorize the real moderator account to write bans.":x.message});
  }else if(id==="apf"){
    var am=$("apm").value.trim(),ar=$("apr");
    if(rx("sex").test(am)||rx("bad").test(am)||rx("thr").test(am)||rx("mean").test(am)){ar.textContent="Appeal denied: your message has language that isn’t allowed.";return}
    b.disabled=true;
    db.collection("appeals").doc(user.uid).set({email:$("ape").value.trim(),first:$("apn").value.trim(),last:$("apl").value.trim(),ban:$("apb").value,msg:am,created:ts()})
      .then(function(){ar.style.color="#3a9000";ar.textContent="Appeal submitted. A moderator must review it; your ban will remain active until a decision is made.";b.disabled=true})
      .catch(function(x){b.disabled=false;ar.textContent="Appeal denied: "+x.message});
  }else if(id==="sf"){
    var tx2=gate($("st").value.trim());if(!tx2)return;$("st").value="";sendM({t:"text",text:tx2});
  }else if(id==="tf"){
    var tn=gate($("tn").value.trim()),td=gate($("td").value.trim()),tl=$("tl").value.trim(),te=new Date($("te").value);
    if(tn===null||td===null)return;
    if(!/^https?:\/\//i.test(tl)){$("ter").textContent="The link must start with http:// or https://";return}
    if(!(te>new Date())){$("ter").textContent="Pick an end time in the future.";return}
    b.disabled=true;
    db.collection("tournaments").add({name:tn,desc:td,img:cs.img||null,link:tl,ends:firebase.firestore.Timestamp.fromDate(te),uid:user.uid,owner:user.displayName||"Player",created:ts()}).then(function(){closeModal();toast("Tournament created!")}).catch(function(x){b.disabled=false;$("ter").textContent=x.message});
  }else if(id==="sn"){
    var dn=gate($("sdn").value.trim());if(!dn)return;
    db.collection("users").doc(user.uid).set({name:dn},{merge:true}).then(function(){toast("Display name saved!")}).catch(function(x){toast(x.message)});
  }else if(id==="su"){
    var nu=$("suu").value.trim(),ee=$("sue");
    if(!/^[A-Za-z0-9_.-]{3,20}$/.test(nu)){ee.textContent="Usernames are 3 to 20 letters, numbers, dots, dashes or underscores.";return}
    b.disabled=true;
    user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(user.email,$("sup").value))
      .then(function(){return user.updateEmail(nu.toLowerCase()+"@mediaverse.example.com")})
      .then(function(){return user.updateProfile({displayName:nu})})
      .then(function(){return db.collection("users").doc(user.uid).set({uname:nu,ul:nu.toLowerCase()},{merge:true})})
      .then(function(){b.disabled=false;e.target.reset();toast("Username changed! Use it the next time you log in.")})
      .catch(function(x){b.disabled=false;ee.textContent=emsg(x)});
  }else if(id==="sp"){
    var pe=$("spe");b.disabled=true;
    user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(user.email,$("sp1").value))
      .then(function(){return user.updatePassword($("sp2").value)})
      .then(function(){b.disabled=false;e.target.reset();toast("Password changed!")})
      .catch(function(x){b.disabled=false;pe.textContent=emsg(x)});
  }else if(id==="pf"){
    var t=$("pt").value.trim(),dr=cs.draw&&cs.drawn?$("cv").toDataURL("image/jpeg",.7):null;
    t=gate(t);if(t===null)return;if(!t&&!dr&&!cs.img)return toast("Add some text, a drawing or a picture first.");
    b.disabled=true;
    db.collection("posts").add({cid:$("pc").value,text:t,draw:dr,img:cs.img,spoiler:cs.spoil,uid:user.uid,name:user.displayName||"Player",created:firebase.firestore.FieldValue.serverTimestamp()})
      .then(function(){closeModal();toast("Posted!")}).catch(function(x){b.disabled=false;toast(x.message)});
  }
});

var usersLoaded=false,bfDone=0;
function back(){
  if(!user||!usersLoaded||bfDone===user.uid)return;bfDone=user.uid;
  var u=users[user.uid],n=user.displayName;if(!n)return;
  if(!u)db.collection("users").doc(user.uid).set({name:n,uname:n,ul:n.toLowerCase(),bio:"",photo:"",created:ts()},{merge:true}).catch(function(){});
  else if(!u.ul)db.collection("users").doc(user.uid).set({uname:n,ul:n.toLowerCase()},{merge:true}).catch(function(){});
}
/* ---------- firebase ---------- */
function mk(d){return Object.assign({id:d.id},d.data())}
function fe(x){
  console.error("Mediaverse Firestore read failed:",x);
  if(x&&x.code==="permission-denied")toast("Missing or insufficient permissions. Check Firestore Rules for this collection.");
  else toast("Couldn’t load data: "+(x&&x.message||"Unknown error"));
}
function chkAcc(){
  if(!user)return;
  user.reload().catch(function(x){
    if(["auth/user-not-found","auth/user-token-expired","auth/invalid-user-token","auth/user-disabled"].indexOf(x.code)>=0){auth.signOut();toast("Your account couldn’t be found, so you were logged out.")}
  });
}
if(fb){
  firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
  auth.onAuthStateChanged(function(u){
    user=u;try{seen=u?+localStorage.getItem("mv_seen_"+u.uid)||0:0}catch(x){}
    if(bu){bu();bu=null}if(cu2){cu2();cu2=null}if(cu){cu();cu=null;cid2=""}bfDone=0;back();
    myBan=null;
    if(u){
      bu=db.collection("bans").doc(u.uid).onSnapshot(function(s){
        myBan=s.exists?s.data():null;
        if(myBan&&myBan.kind==="temp"&&myBan.until){var w=myBan.until.toMillis()-Date.now();if(w>0&&w<2147483000)setTimeout(rq,w+500)}
        rq();
      },function(x){console.error("Ban status listener failed:",x);toast("Couldn’t check ban status. Check Firestore Rules.");});
      cu2=db.collection("calls").where("to","==",u.uid).onSnapshot(function(s){
        s.docChanges().forEach(function(c){
          var d=c.doc.data();if(c.type==="removed")return;
          if(d.state==="ringing")incoming(d);
          else if(d.state==="ended"&&incoming.d&&incoming.d.from===d.from&&!pc)callUI("");
        });
      },function(){});
    }
    rq();
  });
  var L=function(col,n,fn,desc){var r=db.collection(col);if(desc)r=r.orderBy("created","desc");r.limit(n).onSnapshot(function(s){fn(s.docs.map(mk));rq()},fe)};
  L("communities",60,function(a){coms=a},1);
  L("posts",150,function(a){posts=a},1);
  L("comments",500,function(a){cmts=a},1);
  L("yeahs",1000,function(a){yeahs=a},1);
  L("follows",1000,function(a){follows=a},1);
  // Only load friend records where the signed-in user is one of the participants.
  var friendUnsubs=[];
  auth.onAuthStateChanged(function(u){
    friendUnsubs.forEach(function(stop){stop()});friendUnsubs=[];friends=[];
    if(!u){rq();return}
    var seenFriends={};
    function mergeFriends(snap){
      snap.docs.forEach(function(d){seenFriends[d.id]=mk(d)});
      friends=Object.keys(seenFriends).map(function(k){return seenFriends[k]});
      rq();
    }
    ["a","b"].forEach(function(field){
      friendUnsubs.push(db.collection("friends").where(field,"==",u.uid).limit(500)
        .onSnapshot(mergeFriends,fe));
    });
  });
  L("tournaments",60,function(a){tours=a},1);
  L("favs",500,function(a){favs=a});
  L("users",300,function(a){users={};a.forEach(function(u){users[u.id]=u});usersLoaded=true;back()});
  setInterval(chkAcc,30000);document.addEventListener("visibilitychange",function(){if(!document.hidden)chkAcc()});
}
render();
</script>
